# pnpm settings live here in pnpm 10+ (the package.json "pnpm" field is no
# longer read). The lockfile records the postcss override, so a frozen install
# must see the same value.
#
# Installs in CI and in the web image pass --ignore-scripts: esbuild and
# unrs-resolver ship prebuilt platform binaries and their install scripts are
# not needed for the Next build or vitest.
overrides:
  postcss: 8.5.31
