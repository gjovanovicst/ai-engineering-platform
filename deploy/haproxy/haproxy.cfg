global
  daemon
  maxconn 2000

defaults
  mode tcp
  timeout connect 3s
  timeout client 30s
  timeout server 30s

frontend pgbouncer
  bind *:6432
  default_backend pgbouncers

backend pgbouncers
  balance roundrobin
  option tcp-check
  server pgb1 pgbouncer:5432 check
  server pgb2 pgbouncer2:5432 check
