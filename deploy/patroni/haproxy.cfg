global
  daemon
defaults
  mode tcp
  timeout connect 3s
  timeout client 30s
  timeout server 30s
frontend pg
  bind *:5432
  default_backend pg
backend pg
  option httpchk GET /primary
  http-check expect status 200
  server patroni1 172.28.0.18:5432 check port 8008
  server patroni2 172.28.0.17:5432 check port 8008
