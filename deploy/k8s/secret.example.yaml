# Copy to secret.yaml, fill in, and never commit it.
apiVersion: v1
kind: Secret
metadata:
  name: aip-secrets
  namespace: aip
type: Opaque
stringData:
  AIP_DB_DSN: "postgres://aip_app:CHANGE_ME@postgres.aip.svc:5432/aip?sslmode=require"
  AIP_DB_MIGRATOR_DSN: "postgres://aip_migrator:CHANGE_ME@postgres.aip.svc:5432/aip?sslmode=require"
  AIP_SMTP_ADDR: "smtp.example.com:587"
  AIP_MAIL_FROM: "no-reply@example.com"
  GITHUB_TOKEN: ""
  GITLAB_TOKEN: ""
  AIP_OIDC_GITHUB_CLIENT_ID: ""
  AIP_OIDC_GITHUB_CLIENT_SECRET: ""
  AIP_OIDC_GOOGLE_CLIENT_ID: ""
  AIP_OIDC_GOOGLE_CLIENT_SECRET: ""
  jwt.pem: |
    -----BEGIN PRIVATE KEY-----
    CHANGE_ME
    -----END PRIVATE KEY-----
