# The worker needs to create sandbox Jobs, exec into their pods and read
# pod status. Scope it to the namespace; no cluster-wide permissions.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: aip-worker
  namespace: aip
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: aip-worker
  namespace: aip
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["create", "get", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: aip-worker
  namespace: aip
subjects:
  - kind: ServiceAccount
    name: aip-worker
    namespace: aip
roleRef:
  kind: Role
  name: aip-worker
  apiGroup: rbac.authorization.k8s.io
