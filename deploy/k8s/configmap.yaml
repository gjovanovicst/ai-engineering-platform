apiVersion: v1
kind: ConfigMap
metadata:
  name: aip-config
  namespace: aip
data:
  AIP_ENV: production
  AIP_HTTP_ADDR: ":8080"
  AIP_WEB_URL: "https://aip.example.com"
  AIP_API_URL: "https://api.aip.example.com"
  NEXT_PUBLIC_API_URL: "https://api.aip.example.com"
  AIP_LOG_LEVEL: info
  AIP_SANDBOX_DRIVER: k8s
  AIP_SANDBOX_NAMESPACE: aip
  AIP_SANDBOX_IMAGE: "aip/sandbox:go1.25-node22"
  AIP_GITHUB_API_URL: "https://api.github.com"
  AIP_GITHUB_CLONE_BASE: "https://github.com"
  AIP_GITLAB_API_URL: "https://gitlab.com"
  AIP_GITLAB_CLONE_BASE: "https://gitlab.com"
  # AIP_OTEL_ENDPOINT: "http://otel-collector.observability:4318/v1/traces"
