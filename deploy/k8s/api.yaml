apiVersion: apps/v1
kind: Deployment
metadata:
  name: aip-api
  namespace: aip
spec:
  replicas: 2
  selector:
    matchLabels: { app: aip-api }
  template:
    metadata:
      labels: { app: aip-api }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: api
          image: ghcr.io/example/aip-api:latest
          ports: [{ containerPort: 8080, name: http }]
          envFrom:
            - configMapRef: { name: aip-config }
            - secretRef: { name: aip-secrets }
          env:
            - name: AIP_JWT_KEY
              value: /run/secrets/jwt.pem
          volumeMounts:
            - { name: jwt, mountPath: /run/secrets, readOnly: true }
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: 1, memory: 1Gi }
      volumes:
        - name: jwt
          secret:
            secretName: aip-secrets
            items: [{ key: jwt.pem, path: jwt.pem }]
---
apiVersion: v1
kind: Service
metadata:
  name: aip-api
  namespace: aip
spec:
  selector: { app: aip-api }
  ports:
    - port: 80
      targetPort: http
