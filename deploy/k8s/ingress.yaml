apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: aip
  namespace: aip
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
spec:
  ingressClassName: nginx
  tls:
    - hosts: [aip.example.com, api.aip.example.com]
      secretName: aip-tls
  rules:
    - host: aip.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: aip-web
                port: { number: 80 }
    - host: api.aip.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: aip-api
                port: { number: 80 }
