name: pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "docs/user/**"
      - "api/openapi.yaml"
      - "api/events.md"
      - "scripts/build_user_docs.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: build user docs
        run: |
          pip install pyyaml
          python3 scripts/build_user_docs.py
      - name: configure pages
        uses: actions/configure-pages@v5
      - name: upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: deploy pages
        id: deployment
        uses: actions/deploy-pages@v4
