openapi: 3.1.0
info:
  title: AI Engineering Platform API
  version: "1.0.0"
  description: |
    REST API for the AI Engineering Platform. Conventions (pagination, errors, idempotency,
    RBAC) are described in `docs/04-api.md`; the SSE catalog is in `docs/api/events.md`.

    Tenancy: every path except `/auth/*` and `/healthz` is scoped to an organization.
servers:
  - url: /api/v1
security:
  - bearerAuth: []
tags:
  - name: auth
  - name: orgs
  - name: projects
  - name: tasks
  - name: runs
  - name: approvals
  - name: blueprints
  - name: rules
  - name: environments
  - name: analytics
  - name: audit

paths:
  /auth/login:
    post:
      tags: [auth]
      security: []
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, minLength: 8 }

  responses:

        "200":
          description: Tokens
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenPair" }
        "401": { $ref: "#/components/responses/Unauthenticated" }

  /auth/refresh:
    post:
      tags: [auth]
      security: []
      operationId: refresh
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token: { type: string }
      responses:
        "200":
          description: New tokens
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenPair" }
        "401": { $ref: "#/components/responses/Unauthenticated" }

  /auth/me:
    get:
      tags: [auth]
      operationId: getMe
      responses:
        "200":
          description: Profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "401": { $ref: "#/components/responses/Unauthenticated" }

  /auth/register:
    post:
      tags: [auth]
      security: []
      operationId: register
      parameters: [{ $ref: "#/components/parameters/IdempotencyKeyParam" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegisterInput" }
      responses:
        "201":
          description: Account created; verification email sent
          content:
            application/json:
              schema:
                type: object
                properties:
                  user_id: { type: string, format: uuid }
                  email_verified: { type: boolean }
                  org_slug: { type: string }
        "202":
          description: Email already exists (not disclosed; the owner has been emailed)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /auth/verify-email:
    post:
      tags: [auth]
      security: []
      operationId: verifyEmail
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
      responses:
        "200":
          description: Verified
          content:
            application/json:
              schema:
                type: object
                properties:
                  verified: { type: boolean }
        "410": { $ref: "#/components/responses/Conflict" }

  /auth/logout-all:
    post:
      tags: [auth]
      operationId: logoutAll
      security: [{ bearerAuth: [] }]
      responses:
        "204": { description: All sessions revoked }
        "401": { description: Missing or invalid access token }

  /auth/logout:
    post:
      tags: [auth]
      operationId: logout
      responses:
        "204": { description: Session revoked; cookies cleared (web) }

  /auth/password/reset-request:
    post:
      tags: [auth]
      security: []
      operationId: requestPasswordReset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        "202":
          description: Always 202 (regardless of whether the account exists)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /auth/password/reset:
    post:
      tags: [auth]
      security: []
      operationId: resetPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, new_password]
              properties:
                token: { type: string }
                new_password: { type: string, minLength: 12, maxLength: 128 }
      responses:
        "200":
          description: Password changed; all sessions revoked
          content:
            application/json:
              schema:
                type: object
                properties:
                  sessions_revoked: { type: boolean }

  /auth/invites/{token}:
    get:
      tags: [auth]
      security: []
      operationId: previewInvite
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Invite
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InvitePreview" }
        "404": { $ref: "#/components/responses/NotFound" }

  /auth/invites/{token}/accept:
    post:
      tags: [auth]
      security: []
      operationId: acceptInvite
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                password: { type: string, minLength: 12, maxLength: 128 }
                platform: { enum: [web, mobile, cli], default: web }
      responses:
        "200":
          description: Joined; tokens issued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenPair" }
        "409": { $ref: "#/components/responses/Conflict" }

  /auth/sessions:
    get:
      tags: [auth]
      operationId: listSessions
      responses:
        "200":
          description: Active sessions
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Session" }

  /auth/sessions/{session}:
    delete:
      tags: [auth]
      operationId: revokeSession
      parameters:
        - name: session
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204": { description: Revokovana }

  /auth/switch-org:
    post:
      tags: [auth]
      operationId: switchOrg
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [org]
              properties:
                org: { type: string, description: slug or UUID }
      responses:
        "200":
          description: New access token for another active org
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenPair" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /auth/oidc/{provider}/start:
    get:
      tags: [auth]
      security: []
      operationId: oidcStart
      parameters:
        - name: provider
          in: path
          required: true
          schema: { enum: [github, google] }
        - name: redirect_uri
          in: query
          schema: { type: string, default: / }
      responses:
        "302":
          description: Redirect to the provider (state + PKCE)

  /auth/oidc/{provider}/callback:
    get:
      tags: [auth]
      security: []
      operationId: oidcCallback
      parameters:
        - name: provider
          in: path
          required: true
          schema: { enum: [github, google] }
        - name: code
          in: query
          required: true
          schema: { type: string }
        - name: state
          in: query
          required: true
          schema: { type: string }
      responses:
        "302":
          description: Redirect to the app; sets the `aip_rt` and `aip_csrf` cookies

  /orgs:
    get:
      tags: [orgs]
      operationId: listOrgs
      responses:
        "200":
          description: The user's organizations
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Org" }
    post:
      tags: [orgs]
      operationId: createOrg
      parameters: [{ $ref: "#/components/parameters/IdempotencyKeyParam" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, slug]
              properties:
                name: { type: string, minLength: 1, maxLength: 80 }
                slug:
                  type: string
                  pattern: "^[a-z0-9][a-z0-9-]{1,38}[a-z0-9]$"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Org" }
        "409": { $ref: "#/components/responses/Conflict" }

  /orgs/{org}:
    parameters: [{ $ref: "#/components/parameters/OrgParam" }]
    get:
      tags: [orgs]
      operationId: getOrg
      responses:
        "200":
          description: Details
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Org" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [orgs]
      operationId: updateOrg
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                max_concurrent_runs: { type: integer, minimum: 1, maximum: 64 }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Org" }
    delete:
      tags: [orgs]
      operationId: deleteOrg
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirm_slug]
              properties:
                confirm_slug: { type: string }
      responses:
        "204": { description: Deleted }

  /orgs/{org}/projects:
    parameters: [{ $ref: "#/components/parameters/OrgParam" }]
    get:
      tags: [projects]
      operationId: listProjects
      parameters:
        - { $ref: "#/components/parameters/LimitParam" }
        - { $ref: "#/components/parameters/CursorParam" }
        - name: status
          in: query
          schema: { type: string, enum: [active, archived] }
      responses:
        "200":
          description: List
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Project" }
                  next_cursor: { type: [string, "null"] }
    post:
      tags: [projects]
      operationId: createProject
      parameters: [{ $ref: "#/components/parameters/IdempotencyKeyParam" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProjectInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /orgs/{org}/projects/{project}:
    parameters:
      - { $ref: "#/components/parameters/OrgParam" }
      - { $ref: "#/components/parameters/ProjectParam" }
    get:
      tags: [projects]
      operationId: getProject
      responses:
        "200":
          description: Details
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [projects]
      operationId: archiveProject
      responses:
        "204": { description: Arhiviran }

  /orgs/{org}/projects/{project}/test-command:
    parameters:
      - { $ref: "#/components/parameters/OrgParam" }
      - $ref: "#/components/parameters/ProjectParam"
    put:
      tags: [projects]
      operationId: setProjectTestCommand
      description: |
        Stores the project test command. An empty string means the project uses
        the global `AIP_TEST_COMMAND`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [command]
              properties:
                command: { type: string, maxLength: 500 }
      responses:
        "200":
          description: The updated project
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }

  /orgs/{org}/projects/{project}/tasks:
    parameters:
      - { $ref: "#/components/parameters/OrgParam" }
      - { $ref: "#/components/parameters/ProjectParam" }
    get:
      tags: [tasks]
      operationId: listTasks
      parameters:
        - { $ref: "#/components/parameters/LimitParam" }
        - { $ref: "#/components/parameters/CursorParam" }
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/TaskStatus" }
        - name: assignee
          in: query
          schema: { type: string, format: uuid }
        - name: sort
          in: query
          schema: { type: string, enum: ["-updated_at", "updated_at", "priority", "-priority"] }
      responses:
        "200":
          description: List
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Task" }
                  next_cursor: { type: [string, "null"] }
    post:
      tags: [tasks]
      operationId: createTask
      parameters: [{ $ref: "#/components/parameters/IdempotencyKeyParam" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TaskInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Task" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /orgs/{org}/projects/{project}/tasks/{task}:
    parameters:
      - { $ref: "#/components/parameters/OrgParam" }
      - { $ref: "#/components/parameters/ProjectParam" }
      - $ref: "#/components/parameters/TaskParam"
    get:
      tags: [tasks]
      operationId: getTask
      responses:
        "200":
          description: Details
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Task" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [tasks]
      operationId: updateTask
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TaskInput" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Task" }

  /orgs/{org}/projects/{project}/tasks/{task}/transitions:
    parameters:
      - { $ref: "#/components/parameters/OrgParam" }
      - { $ref: "#/components/parameters/ProjectParam" }
      - $ref: "#/components/parameters/TaskParam"
    post:
      tags: [tasks]
      operationId: transitionTask
      parameters: [{ $ref: "#/components/parameters/IdempotencyKeyParam" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [to]
              properties:
                to: { $ref: "#/components/schemas/TaskStatus" }
                reason: { type: [string, "null"] }
      responses:
        "200":
          description: New status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Task" }
        "409": { $ref: "#/components/responses/Conflict" }

  /orgs/{org}/members:
    parameters: [{ $ref: "#/components/parameters/OrgParam" }]
    get:
      tags: [orgs]
      operationId: listMembers
      responses:
        "200":
          description: Members
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Member" }
    post:
      tags: [orgs]
      operationId: inviteMember
      parameters: [{ $ref: "#/components/parameters/IdempotencyKeyParam" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, role]
              properties:
                email: { type: string, format: email }
                role: { $ref: "#/components/schemas/OrgRole" }
      responses:
        "201":
          description: Invite sent
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Member" }
        "409": { $ref: "#/components/responses/Conflict" }

  /orgs/{org}/providers:
    parameters: [{ $ref: "#/components/parameters/OrgParam" }]
    get:
      tags: [orgs]
      operationId: listProviders
      description: Never returns secrets; only `has_key`.
      responses:
        "200":
          description: Providers
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Provider" }
    post:
      tags: [orgs]
      operationId: createProvider
      parameters: [{ $ref: "#/components/parameters/IdempotencyKeyParam" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, base_url]
              properties:
                name: { type: string, example: openai-compatible }
                base_url: { type: string, format: uri }
                model: { type: string }
                api_key: { type: string, writeOnly: true, description: "Encrypted at rest; requires AIP_SECRETS_KEY" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Provider" }

  /orgs/{org}/projects/{project}/repos:
    parameters:
      - { $ref: "#/components/parameters/OrgParam" }
      - { $ref: "#/components/parameters/ProjectParam" }
    get:
      tags: [projects]
      operationId: listRepos
      responses:
        "200":
          description: Repositories
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Repo" }
    post:
      tags: [projects]
      operationId: connectRepo
      parameters: [{ $ref: "#/components/parameters/IdempotencyKeyParam" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [full_name]
              properties:
                full_name: { type: string, example: acme/crm-platform }
                default_branch: { type: string, default: main }
      responses:
        "201":
          description: Connected
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Repo" }
        "409": { $ref: "#/components/responses/Conflict" }

  /orgs/{org}/projects/{project}/repos/{repo}/credential:
    parameters:
      - { $ref: "#/components/parameters/OrgParam" }
      - { $ref: "#/components/parameters/ProjectParam" }
      - { $ref: "#/components/parameters/RepoParam" }
    get:
      tags: [projects]
      operationId: getRepoCredential
      description: >-
        Reports whether the repository has its own git credential. The token
        itself is never returned.
      responses:
        "200":
          description: Credential status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RepoCredential" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [projects]
      operationId: setRepoCredential
      description: >-
        Stores an encrypted per-repository token (owner/admin only). Resolution
        order is: repository credential, GitHub App installation token, global
        provider token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token:
                  type: string
                  writeOnly: true
                  description: "Fine-grained PAT or GitLab token; encrypted at rest (AIP_SECRETS_KEY)."
      responses:
        "200":
          description: Stored
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RepoCredential" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [projects]
      operationId: deleteRepoCredential
      description: Removes the repository credential and falls back to the GitHub App or global token.
      responses:
        "204":
          description: Removed
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /orgs/{org}/repos/{repo}/pull-requests:
    parameters:
      - { $ref: "#/components/parameters/OrgParam" }
      - { $ref: "#/components/parameters/RepoParam" }
    get:
      tags: [projects]
      operationId: listPullRequests
      responses:
        "200":
          description: Pull requests
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/PullRequest" }

  /orgs/{org}/pull-requests/{pr}:
    parameters:
      - { $ref: "#/components/parameters/OrgParam" }
      - { $ref: "#/components/parameters/PrParam" }
    get:
      tags: [projects]
      operationId: getPullRequest
      responses:
        "200":
          description: Details sa checks, fajlovima i review nalazima
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PullRequestDetail" }
        "404": { $ref: "#/components/responses/NotFound" }

  /orgs/{org}/projects/{project}/tests:
    parameters:
      - { $ref: "#/components/parameters/OrgParam" }
      - { $ref: "#/components/parameters/ProjectParam" }
    get:
      tags: [projects]
      operationId: listTestResults
      parameters:
        - { $ref: "#/components/parameters/LimitParam" }
        - { $ref: "#/components/parameters/CursorParam" }
        - name: run
          in: query
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Test results
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/TestSummary" }
                  next_cursor: { type: [string, "null"] }

  /orgs/{org}/tasks/{task}/runs:
    parameters:
      - { $ref: "#/components/parameters/OrgParam" }
      - $ref: "#/components/parameters/TaskParam"
    post:
      tags: [runs]
      operationId: startRun
      parameters: [{ $ref: "#/components/parameters/IdempotencyKeyParam" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RunInput" }
      responses:
        "202":
          description: Accepted
          headers:
            Location:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Run" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /orgs/{org}/runs:
    parameters: [{ $ref: "#/components/parameters/OrgParam" }]
    get:
      tags: [runs]
      operationId: listRuns
      parameters:
        - { $ref: "#/components/parameters/LimitParam" }
        - { $ref: "#/components/parameters/CursorParam" }
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/RunStatus" }
        - name: agent_type
          in: query
          schema: { $ref: "#/components/schemas/AgentType" }
      responses:
        "200":
          description: List
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Run" }
                  next_cursor: { type: [string, "null"] }

  /orgs/{org}/runs/{run}:
    parameters:
      - { $ref: "#/components/parameters/OrgParam" }
      - $ref: "#/components/parameters/RunParam"
    get:
      tags: [runs]
      operationId: getRun
      responses:
        "200":
          description: Details
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RunDetail" }
        "404": { $ref: "#/components/responses/NotFound" }

  /orgs/{org}/runs/{run}/cancel:
    parameters:
      - { $ref: "#/components/parameters/OrgParam" }
      - $ref: "#/components/parameters/RunParam"
    post:
      tags: [runs]
      operationId: cancelRun
      parameters: [{ $ref: "#/components/parameters/IdempotencyKeyParam" }]
      responses:
        "202":
          description: Cancellation requested
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Run" }
        "409": { $ref: "#/components/responses/Conflict" }

  /orgs/{org}/runs/{run}/retry:
    parameters:
      - { $ref: "#/components/parameters/OrgParam" }
      - $ref: "#/components/parameters/RunParam"
    post:
      tags: [runs]
      operationId: retryRun
      description: |
        Starts a new development run with the failed run's approved plan. No
        planning run and no new plan approval are needed; the task returns to
        `in_progress` and the new run is queued.
      parameters: [{ $ref: "#/components/parameters/IdempotencyKeyParam" }]
      responses:
        "202":
          description: A new development run was queued with the same plan
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Run" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

