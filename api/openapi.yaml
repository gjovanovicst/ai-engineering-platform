  /orgs/{org}/blueprints/{blueprint}/versions:
    parameters:
      - { $ref: "#/components/parameters/OrgParam" }
      - name: blueprint
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [projects]
      operationId: createBlueprintVersion
      description: Clone a blueprint into the next draft version.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                spec: { type: object }
      responses:
        "201":
          description: New draft version
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Blueprint" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /orgs/{org}/blueprints/{blueprint}/publish:
    parameters:
      - { $ref: "#/components/parameters/OrgParam" }
      - $ref: "#/components/parameters/BlueprintParam"
    post:
      tags: [blueprints]
      operationId: publishBlueprint
      responses:
        "200":
          description: Published (immutable from now on)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Blueprint" }
        "409": { $ref: "#/components/responses/Conflict" }

  /orgs/{org}/blueprints/{blueprint}/instantiate:
    parameters:
      - { $ref: "#/components/parameters/OrgParam" }
      - $ref: "#/components/parameters/BlueprintParam"
    post:
      tags: [blueprints]
      operationId: instantiateBlueprint
      responses:
        "201":
          description: Project created from the blueprint (plus its starter tasks)
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/Project" }
                  - type: object
                    properties:
                      created_tasks: { type: integer }
        "409": { $ref: "#/components/responses/Conflict" }

  /orgs/{org}/projects/{project}/tasks/{task}/runs:
    parameters:
      - { $ref: "#/components/parameters/OrgParam" }
      - { $ref: "#/components/parameters/ProjectParam" }
      - $ref: "#/components/parameters/TaskParam"
    get:
      tags: [runs]
      operationId: listTaskRuns
      responses:
        "200":
          description: Runs of the task, newest first
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Run" }
    post:
      tags: [runs]
      operationId: startTaskRun
      parameters: [{ $ref: "#/components/parameters/IdempotencyKeyParam" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                agent_type: { $ref: "#/components/schemas/AgentType" }
                model: { type: string }
      responses:
        "202":
          description: Accepted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Run" }
        "409": { $ref: "#/components/responses/Conflict" }

  /webhooks/github/{repo}:
    parameters:
      - name: repo
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [webhooks]
      operationId: githubWebhook
      security: []
      description: Verified with X-Hub-Signature-256 using the repo secret.
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        "202": { description: Accepted }
        "401": { $ref: "#/components/responses/Unauthenticated" }

  /webhooks/gitlab/{repo}:
    parameters:
      - name: repo
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [webhooks]
      operationId: gitlabWebhook
      security: []
      description: Verified with X-Gitlab-Token using the repo secret.
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        "202": { description: Accepted }
        "401": { $ref: "#/components/responses/Unauthenticated" }

  /orgs/{org}/projects/{project}/pull-requests:
    parameters:
      - { $ref: "#/components/parameters/OrgParam" }
      - { $ref: "#/components/parameters/ProjectParam" }
    get:
      tags: [projects]
      operationId: listProjectPullRequests
      responses:
        "200":
          description: Pull/merge requests opened for the project
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/PullRequest" }

  /invites/accept:
    post:
      tags: [invites]
      operationId: registerAndAcceptInvite
      security: []
      description: |
        Accepts an invite for a user without an existing account: creates the user,
        adds the membership and returns a session.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, name, password]
              properties:
                token: { type: string }
                name: { type: string }
                password: { type: string, minLength: 12 }
      responses:
        "201":
          description: Account created and signed in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenPair" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { $ref: "#/components/responses/Conflict" }

  /orgs/{org}/repos:
    parameters: [{ $ref: "#/components/parameters/OrgParam" }]
    get:
      tags: [projects]
      operationId: listOrgRepos
      responses:
        "200":
          description: Connected repositories across the workspace
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string, format: uuid }
                        project_id: { type: string, format: uuid }
                        project_name: { type: string }
                        provider: { type: string, enum: [github, gitlab, gitea, bitbucket] }
                        name: { type: string }
                        default_branch: { type: string }
                        created_at: { type: string, format: date-time }

  /orgs/{org}/deployments/{deployment}/approve:
    parameters:
      - { $ref: "#/components/parameters/OrgParam" }
      - name: deployment
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [environments]
      operationId: approveDeployment
      description: Four-eyes gate for prod; the approver must differ from the requester.
      responses:
        "200":
          description: Approved and deployed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Deployment" }
        "409": { $ref: "#/components/responses/Conflict" }

  /orgs/{org}/model-prices:
    parameters: [{ $ref: "#/components/parameters/OrgParam" }]
    get:
      tags: [orgs]
      operationId: listModelPrices
      responses:
        "200":
          description: Model prices (USD per 1K tokens)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        provider: { type: string }
                        model: { type: string }
                        input_per_1k: { type: number }
                        output_per_1k: { type: number }
    put:
      tags: [orgs]
      operationId: upsertModelPrice
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [provider, model, input_per_1k, output_per_1k]
              properties:
                provider: { type: string }
                model: { type: string }
                input_per_1k: { type: number, minimum: 0 }
                output_per_1k: { type: number, minimum: 0 }
      responses:
        "200": { description: Saved }
        "400": { $ref: "#/components/responses/BadRequest" }

  /orgs/{org}/providers/{provider}/rotate:
    parameters:
      - { $ref: "#/components/parameters/OrgParam" }
      - name: provider
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [orgs]
      operationId: rotateProviderKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [api_key]
              properties:
                api_key: { type: string, writeOnly: true }
      responses:
        "200":
          description: Key replaced (old ciphertext is overwritten)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Provider" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /orgs/{org}/providers/{provider}:
    parameters:
      - { $ref: "#/components/parameters/OrgParam" }
      - name: provider
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      tags: [orgs]
      operationId: setProviderEnabled
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled: { type: boolean }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Provider" }
    delete:
      tags: [orgs]
      operationId: deleteProvider
      responses:
        "204": { description: Deleted with its key }
        "404": { $ref: "#/components/responses/NotFound" }

  /orgs/{org}/design-tokens:
    parameters: [{ $ref: "#/components/parameters/OrgParam" }]
    get:
      tags: [design]
      operationId: listDesignTokens
      responses:
        "200":
          description: Org design tokens
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/DesignToken" }
    post:
      tags: [design]
      operationId: createDesignToken
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DesignTokenInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DesignToken" }

  /orgs/{org}/design-tokens/{token}:
    parameters:
      - { $ref: "#/components/parameters/OrgParam" }
      - name: token
        in: path
        required: true
        schema: { type: string, format: uuid }
    put:
      tags: [design]
      operationId: updateDesignToken
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DesignTokenInput" }
      responses:
        "200": { description: Updated }
    delete:
      tags: [design]
      operationId: deleteDesignToken
      responses:
        "204": { description: Deleted }

  /orgs/{org}/design/seed:
    parameters: [{ $ref: "#/components/parameters/OrgParam" }]
    post:
      tags: [design]
      operationId: seedDesignRegistry
      description: Inserts the built-in baseline when the registry is empty.
      responses:
        "200":
          description: Created counts
          content:
            application/json:
              schema:
                type: object
                properties:
                  tokens: { type: integer }
                  components: { type: integer }

  /orgs/{org}/pull-requests/{pr}/checks:
    parameters:
      - { $ref: "#/components/parameters/OrgParam" }
      - name: pr
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [git]
      operationId: listPullRequestChecks
      responses:
        "200":
          description: CI checks recorded for the pull request
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/CheckResult" }

  /orgs/{org}/runs/{run}/checks:
    parameters:
      - { $ref: "#/components/parameters/OrgParam" }
      - name: run
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [git]
      operationId: listRunChecks
      responses:
        "200":
          description: CI checks recorded for the run
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/CheckResult" }

  /orgs/{org}/projects/{project}/components:
    parameters:
      - { $ref: "#/components/parameters/OrgParam" }
      - { $ref: "#/components/parameters/ProjectParam" }
    get:
      tags: [projects]
      operationId: listProjectComponents
      responses:
        "200":
          description: Allowed components for the project
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Component" }
    put:
      tags: [projects]
      operationId: setProjectComponents
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [component_ids]
              properties:
                component_ids:
                  type: array
                  items: { type: string, format: uuid }
      responses:
        "200":
          description: Allowlist replaced
          content:
            application/json:
              schema:
                type: object
                properties:
                  count: { type: integer }
        "400": { $ref: "#/components/responses/BadRequest" }

  /orgs/{org}/projects/{project}/standards:
    parameters:
      - { $ref: "#/components/parameters/OrgParam" }
      - { $ref: "#/components/parameters/ProjectParam" }
    get:
      tags: [projects]
      operationId: getProjectStandard
      responses:
        "200":
          description: The assigned design standard (or null)
          content:
            application/json:
              schema:
                type: object
                properties:
                  design_standard:
                    oneOf:
                      - { $ref: "#/components/schemas/DesignStandard" }
                      - { type: "null" }
    put:
      tags: [projects]
      operationId: setProjectStandard
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                design_standard_id: { type: [string, "null"], format: uuid }
      responses:
        "200":
          description: Updated project
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /orgs/{org}/projects/{project}/required-checks:
    parameters:
      - { $ref: "#/components/parameters/OrgParam" }
      - { $ref: "#/components/parameters/ProjectParam" }
    put:
      tags: [projects]
      operationId: updateProjectRequiredChecks
      description: Checks that must pass before a pull request can be merged.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [checks]
              properties:
                checks:
                  type: array
                  items: { type: string }
      responses:
        "200":
          description: Updated project
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /orgs/{org}/runs/{run}/usage:
    parameters:
      - { $ref: "#/components/parameters/OrgParam" }
      - name: run
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [runs]
      operationId: getRunUsage
      responses:
        "200":
          description: Token usage and cost of one run
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        provider: { type: string }
                        model: { type: string }
                        input_tokens: { type: integer }
                        output_tokens: { type: integer }
                        cost_usd: { type: number }
                  totals:
                    type: object
                    properties:
                      input_tokens: { type: integer }
                      output_tokens: { type: integer }
                      cost_usd: { type: number }

  /orgs/{org}/runs/{run}/artifacts:
    parameters:
      - { $ref: "#/components/parameters/OrgParam" }
      - name: run
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [runs]
      operationId: listRunArtifacts
      responses:
        "200":
          description: Artifacts stored in the object store
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        kind: { type: string }
                        key: { type: string }
                        bytes: { type: integer }
                        sha256: { type: string }
                        created_at: { type: string, format: date-time }

  /orgs/{org}/members/{user}:
    parameters:
      - { $ref: "#/components/parameters/OrgParam" }
      - name: user
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      tags: [orgs]
      operationId: updateMemberRole
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role: { $ref: "#/components/schemas/OrgRole" }
      responses:
        "204": { description: Role changed }
        "400": { $ref: "#/components/responses/BadRequest" }
    delete:
      tags: [orgs]
      operationId: removeMember
      responses:
        "204": { description: Member removed }
        "400": { $ref: "#/components/responses/BadRequest" }

  /orgs/{org}/design-standards:
    parameters: [{ $ref: "#/components/parameters/OrgParam" }]
    get:
      tags: [projects]
      operationId: listDesignStandards
      responses:
        "200":
          description: Design standards with their versions
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/DesignStandard" }
    post:
      tags: [projects]
      operationId: createDesignStandard
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, spec]
              properties:
                name: { type: string, minLength: 3, maxLength: 80 }
                spec: { type: object }
      responses:
        "201":
          description: Created draft version
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DesignStandard" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /orgs/{org}/design-standards/{standard}:
    parameters:
      - { $ref: "#/components/parameters/OrgParam" }
      - name: standard
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [projects]
      operationId: getDesignStandard
      responses:
        "200":
          description: One version
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DesignStandard" }
        "404": { $ref: "#/components/responses/NotFound" }

  /orgs/{org}/design-standards/{standard}/versions:
    parameters:
      - { $ref: "#/components/parameters/OrgParam" }
      - name: standard
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [projects]
      operationId: createDesignStandardVersion
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                spec: { type: object }
      responses:
        "201":
          description: Next draft version
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DesignStandard" }

  /orgs/{org}/design-standards/{standard}/publish:
    parameters:
      - { $ref: "#/components/parameters/OrgParam" }
      - name: standard
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [projects]
      operationId: publishDesignStandard
      responses:
        "200":
          description: Published version
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DesignStandard" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    OrgParam:
      name: org
      in: path
      required: true
      schema: { type: string }
    ProjectParam:
      name: project
      in: path
      required: true
      schema: { type: string }
    TaskParam:
      name: task
      in: path
      required: true
      description: Task UUID or `ref` (e.g. `T-88`)
      schema: { type: string }
    RunParam:
      name: run
      in: path
      required: true
      schema: { type: string, format: uuid }
    LimitParam:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
    CursorParam:
      name: cursor
      in: query
      schema: { type: string }
    DsParam:
      name: ds
      in: path
      required: true
      schema: { type: string, format: uuid }
    ComponentParam:
      name: component
      in: path
      required: true
      schema: { type: string }
    FindingParam:
      name: finding
      in: path
      required: true
      schema: { type: string, format: uuid }
    DeploymentParam:
      name: deployment
      in: path
      required: true
      schema: { type: string, format: uuid }
    RepoParam:
      name: repo
      in: path
      required: true
      schema: { type: string, format: uuid }
    PrParam:
      name: pr
      in: path
      required: true
      description: PR number or UUID
      schema: { type: string }
    IdempotencyKeyParam:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 8, maxLength: 128 }

    BlueprintParam:
      name: blueprint
      in: path
      required: true
      schema: { type: string, format: uuid }

  responses:
    BadRequest:
      description: Validation failed
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Unauthenticated:
      description: Nema ili istekao token
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Forbidden:
      description: Nema dozvolu
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    NotFound:
      description: Ne postoji ili nema pristupa
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Conflict:
      description: Konflikt stanja
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    RateLimited:
      description: Rate limit exceeded
      headers:
        Retry-After:
          schema: { type: integer }
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }

  schemas:
    Problem:
      type: object
      required: [type, title, status, code]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        code: { type: string }
        fields:
          type: array
          items:
            type: object
            properties:
              path: { type: string }
              message: { type: string }

    TokenPair:
      type: object
      required: [access_token, refresh_token, expires_in]
      properties:
        access_token: { type: string }
        refresh_token: { type: string }
        expires_in: { type: integer, description: seconds }

    Me:
      type: object
      properties:
        user: { $ref: "#/components/schemas/User" }
        orgs:
          type: array
          items:
            type: object
            properties:
              org: { $ref: "#/components/schemas/Org" }
              role: { $ref: "#/components/schemas/OrgRole" }

    User:
      type: object
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        name: { type: string }
        avatar_url: { type: [string, "null"], format: uri }

    OrgRole:
      type: string
      enum: [owner, admin, member, viewer, designer]

    Org:
      type: object
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        name: { type: string }
        max_concurrent_runs: { type: integer }
        created_at: { type: string, format: date-time }

    ProjectInput:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        description: { type: string, maxLength: 5000 }
        blueprint_id: { type: [string, "null"], format: uuid }
        tech_stack:
          type: array
          items: { type: string }

    Project:
      allOf:
        - $ref: "#/components/schemas/ProjectInput"
        - type: object
          properties:
            id: { type: string, format: uuid }
            slug: { type: string }
            test_command: { type: string }
            required_checks:
              type: array
              items: { type: string }
            status: { type: string, enum: [active, archived] }
            created_at: { type: string, format: date-time }
            updated_at: { type: string, format: date-time }

    TaskStatus:
      type: string
      enum: [draft, ready, planning, in_progress, review, done, blocked, canceled]

    TaskPriority:
      type: string
      enum: [low, med, high]

    AcceptanceCriterion:
      type: object
      required: [given, when, then]
      properties:
        given: { type: string }
        when: { type: string }
        then: { type: string }

    TaskInput:
      type: object
      required: [title]
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        description: { type: string, maxLength: 20000 }
        acceptance:
          type: array
          items: { $ref: "#/components/schemas/AcceptanceCriterion" }
        priority: { $ref: "#/components/schemas/TaskPriority" }
        tags:
          type: array
          items: { type: string }
        assignee_id: { type: [string, "null"], format: uuid }
        depends_on:
          type: array
          maxItems: 20
          items: { type: string, example: T-12 }

    Task:
      allOf:
        - $ref: "#/components/schemas/TaskInput"
        - type: object
          properties:
            id: { type: string, format: uuid }
            ref: { type: string, example: T-88 }
            status: { $ref: "#/components/schemas/TaskStatus" }
            project_id: { type: string, format: uuid }
            blocked_reason: { type: [string, "null"] }
            ready_at: { type: [string, "null"], format: date-time }
            done_at: { type: [string, "null"], format: date-time }
            created_at: { type: string, format: date-time }
            updated_at: { type: string, format: date-time }

    AgentType:
      type: string
      enum: [planning, development, testing, review, documentation]

    RunStatus:
      type: string
      enum: [queued, running, awaiting_approval, succeeded, failed, canceled]

    PhaseName:
      type: string
      enum: [context, plan, implement, test, review, diff, pr]

    Phase:
      type: object
      properties:
        phase: { $ref: "#/components/schemas/PhaseName" }
        state: { type: string, enum: [pending, active, done, failed, skipped] }
        attempt: { type: integer }
        started_at: { type: [string, "null"], format: date-time }
        ended_at: { type: [string, "null"], format: date-time }

    Budget:
      type: object
      properties:
        tokens_in: { type: integer, minimum: 1 }
        tokens_out: { type: integer, minimum: 1 }
        cost_micros: { type: integer, minimum: 1 }
        wall_clock_s: { type: integer, minimum: 60 }

    RunInput:
      type: object
      required: [agent_type, model]
      properties:
        agent_type: { $ref: "#/components/schemas/AgentType" }
        model: { type: string, example: gpt-4o }
        dry_run: { type: boolean, default: false }
        budget: { $ref: "#/components/schemas/Budget" }

    Run:
      type: object
      properties:
        id: { type: string, format: uuid }
        status: { $ref: "#/components/schemas/RunStatus" }
        agent_type: { $ref: "#/components/schemas/AgentType" }
        model: { type: string }
        task_id: { type: [string, "null"], format: uuid }
        project_id: { type: string, format: uuid }
        current_phase: { $ref: "#/components/schemas/PhaseName" }
        spent:
          type: object
          properties:
            tokens_in: { type: integer }
            tokens_out: { type: integer }
            cost_micros: { type: integer }
        budget: { $ref: "#/components/schemas/Budget" }
        failure_code: { type: [string, "null"] }
        started_at: { type: [string, "null"], format: date-time }
        finished_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }

    RunDetail:
      allOf:
        - $ref: "#/components/schemas/Run"
        - type: object
          properties:
            phases:
              type: array
              items: { $ref: "#/components/schemas/Phase" }
            rules_snapshot:
              type: array
              items:
                type: object
                properties:
                  rule_id: { type: string, format: uuid }
                  name: { type: string }
                  version: { type: integer }
                  sha256: { type: string }
            pr_url: { type: [string, "null"], format: uri }

    DiffSummary:
      type: object
      properties:
        files: { type: integer }
        additions: { type: integer }
        deletions: { type: integer }
        artifact_url: { type: string, format: uri }

    ApprovalStatus:
      type: string
      enum: [pending, approved, rejected, changes_requested, expired]

    Approval:
      type: object
      properties:
        id: { type: string, format: uuid }
        run_id: { type: [string, "null"], format: uuid }
        type: { type: string, enum: [plan, pr, deploy_prod, rule_publish] }
        status: { $ref: "#/components/schemas/ApprovalStatus" }
        requested_at: { type: string, format: date-time }
        decided_at: { type: [string, "null"], format: date-time }
        decided_by: { type: [string, "null"], format: uuid }
        reason: { type: [string, "null"] }

    Blueprint:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        latest_version: { type: [string, "null"] }
        published_at: { type: [string, "null"], format: date-time }

    Rule:
      type: object
      properties:
        id: { type: string, format: uuid }
        level: { type: string, enum: [organization, project, module, task] }
        name: { type: string }
        active_version: { type: [integer, "null"] }
        updated_at: { type: [string, "null"], format: date-time }

    Environment:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string, enum: [dev, staging, prod] }
        url: { type: [string, "null"], format: uri }

    Deployment:
      type: object
      properties:
        id: { type: string, format: uuid }
        environment_id: { type: string, format: uuid }
        release_ref: { type: string }
        status: { type: string, enum: [queued, running, succeeded, failed, rolled_back] }
        created_at: { type: string, format: date-time }

    Kpi:
      type: object
      properties:
        key: { type: string }
        value: { type: number }
        unit: { type: [string, "null"] }
        source: { type: string, enum: [measured, estimated, na] }

    AnalyticsSummary:
      type: object
      properties:
        from: { type: string, format: date }
        to: { type: string, format: date }
        kpis:
          type: array
          items: { $ref: "#/components/schemas/Kpi" }
        series:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              points:
                type: array
                items:
                  type: object
                  properties:
                    t: { type: string, format: date }
                    v: { type: number }

    UsageReport:
      type: object
      properties:
        total_cost_micros: { type: integer }
        total_tokens_in: { type: integer }
        total_tokens_out: { type: integer }
        groups:
          type: array
          items:
            type: object
            properties:
              key: { type: string }
              cost_micros: { type: integer }
              tokens_in: { type: integer }
              tokens_out: { type: integer }

    AuditEntry:
      type: object
      properties:
        id: { type: integer, format: int64 }
        action: { type: string }
        actor_id: { type: [string, "null"], format: uuid }
        actor_kind: { type: string, enum: [user, api_key, system] }
        target: { type: string }
        metadata: { type: object, additionalProperties: true }
        created_at: { type: string, format: date-time }

    Member:
      type: object
      properties:
        user_id: { type: string, format: uuid }
        email: { type: string, format: email }
        name: { type: string }
        role: { $ref: "#/components/schemas/OrgRole" }
        last_active_at: { type: [string, "null"], format: date-time }

    Provider:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        base_url: { type: string, format: uri }
        enabled: { type: boolean }
        model: { type: string }
        kind: { type: string, enum: [openai, anthropic] }
        key_hint: { type: string, description: "last characters of the stored key, never the key" }
        has_key: { type: boolean, description: "true if a secret is set (never returned)" }

    Repo:
      type: object
      properties:
        id: { type: string, format: uuid }
        provider: { type: string, example: github }
        full_name: { type: string, example: acme/crm-platform }
        default_branch: { type: string }
        open_prs: { type: integer }
        last_sync_at: { type: [string, "null"], format: date-time }

    RepoCredential:
      type: object
      properties:
        configured: { type: boolean }
        hint:
          type: string
          example: "…9f2c"
          description: "Last four characters of the token; never the token itself."
        updated_at: { type: [string, "null"], format: date-time }

    Check:
      type: object
      properties:
        name: { type: string }
        state: { type: string, enum: [passed, failed, running, pending, skipped] }
        meta: { type: [string, "null"] }

    PullRequest:
      type: object
      properties:
        id: { type: string, format: uuid }
        number: { type: integer }
        title: { type: string }
        url: { type: string, format: uri }
        head: { type: string }
        base: { type: string }
        state: { type: string, enum: [open, closed, merged] }
        checks_summary:
          type: object
          properties:
            passed: { type: integer }
            total: { type: integer }
            running: { type: integer }
        updated_at: { type: string, format: date-time }

    PullRequestDetail:
      allOf:
        - $ref: "#/components/schemas/PullRequest"
        - type: object
          properties:
            checks:
              type: array
              items: { $ref: "#/components/schemas/Check" }
            files:
              type: array
              items:
                type: object
                properties:
                  status: { type: string, enum: [added, modified, deleted] }
                  path: { type: string }
                  additions: { type: integer }
                  deletions: { type: integer }
            review:
              type: object
              properties:
                issues:
                  type: array
                  items:
                    type: object
                    properties:
                      severity: { type: string, enum: [blocker, major, minor, nit] }
                      text: { type: string }
                cost_micros: { type: integer }
                duration_ms: { type: integer }
            reviewers:
              type: array
              items:
                type: object
                properties:
                  user_id: { type: [string, "null"], format: uuid }
                  name: { type: string }
                  state: { type: string, enum: [requested, approved, done] }
            linked:
              type: object
              properties:
                task_id: { type: [string, "null"], format: uuid }
                requirement: { type: [string, "null"] }
                tests: { type: integer }

    TestSummary:
      type: object
      properties:
        id: { type: string, format: uuid }
        suite: { type: string }
        total: { type: integer }
        passed: { type: integer }
        failed: { type: integer }
        skipped: { type: integer }
        coverage_pct: { type: [number, "null"] }
        commit_sha: { type: [string, "null"] }
        created_at: { type: string, format: date-time }

    DesignSystem:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        latest_version: { type: [string, "null"] }

    DesignSystemVersion:
      type: object
      properties:
        id: { type: string, format: uuid }
        design_system_id: { type: string, format: uuid }
        version: { type: string }
        published_at: { type: [string, "null"], format: date-time }
        sha256: { type: string }

    Component:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        category: { type: string }
        latest_version: { type: [string, "null"] }
        status: { type: [string, "null"], enum: [stable, beta, deprecated, null] }
        framework: { type: string }
        package: { type: string }
        import_path: { type: string }
        version: { type: string }
        docs: { type: string }
        example: { type: string }

    ComponentVersion:
      type: object
      properties:
        id: { type: string, format: uuid }
        version: { type: string }
        status: { type: string, enum: [stable, beta, deprecated] }
        props:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              type: { type: string }
              default: { type: string }
              description: { type: string }
        a11y_notes: { type: [string, "null"] }
        ai_notes: { type: [string, "null"] }

    Comment:
      type: object
      properties:
        id: { type: string, format: uuid }
        task_id: { type: string, format: uuid }
        author_id: { type: [string, "null"], format: uuid }
        body: { type: string }
        created_at: { type: string, format: date-time }

    Notification:
      type: object
      properties:
        id: { type: string, format: uuid }
        kind: { type: string }
        title: { type: string }
        body: { type: string }
        target: { type: [string, "null"] }
        read_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }

    SearchResult:
      type: object
      properties:
        type: { enum: [project, task, component, run, rule] }
        id: { type: string }
        title: { type: string }
        subtitle: { type: [string, "null"] }
        url: { type: string }

    ActivityItem:
      type: object
      properties:
        id: { type: integer, format: int64 }
        action: { type: string }
        actor: { type: [string, "null"] }
        target: { type: string }
        created_at: { type: string, format: date-time }

    RegisterInput:
      type: object
      required: [email, password, name]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 12, maxLength: 128 }
        name: { type: string, minLength: 1, maxLength: 80 }
        org_name: { type: string, maxLength: 80 }

    InvitePreview:
      type: object
      properties:
        org_name: { type: string }
        email: { type: string, format: email }
        role: { $ref: "#/components/schemas/OrgRole" }
        expires_at: { type: string, format: date-time }

    Session:
      type: object
      properties:
        id: { type: string, format: uuid }
        platform: { type: string, enum: [web, mobile, cli] }
        ip: { type: [string, "null"] }
        user_agent: { type: [string, "null"] }
        last_used_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }
        current: { type: boolean }

    Invite:
      type: object
      required: [id, email, role, expires_at]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        role: { type: string, enum: [owner, admin, member, viewer] }
        expires_at: { type: string, format: date-time }
        accepted_at: { type: [string, "null"], format: date-time }

    MetricsSummary:
      type: object
      required: [days, runs_by_status, succeeded_runs, lead_time_minutes, approval_minutes, runs_per_task, merged_pull_requests, cost_usd]
      properties:
        days: { type: integer }
        runs_by_status:
          type: object
          additionalProperties: { type: integer }
        succeeded_runs: { type: integer }
        lead_time_minutes: { $ref: "#/components/schemas/Metric" }
        approval_minutes: { $ref: "#/components/schemas/Metric" }
        runs_per_task: { $ref: "#/components/schemas/Metric" }
        merged_pull_requests: { type: integer }
        cost_usd: { $ref: "#/components/schemas/Metric" }

    Metric:
      type: object
      required: [value, unit, source]
      properties:
        value: { type: number }
        unit: { type: string }
        source: { type: string, enum: [measured, estimated, na] }

    DesignToken:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        value: { type: string }
        category: { type: string, enum: [color, typography, spacing, radius, layout, other] }

    DesignTokenInput:
      type: object
      required: [name, value]
      properties:
        name: { type: string, maxLength: 80 }
        value: { type: string }
        category: { type: string, enum: [color, typography, spacing, radius, layout, other] }

    ComponentEntry:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        purpose: { type: string }
        rules: { type: string }
        status: { type: string, enum: [draft, published, deprecated] }

    ComponentEntryInput:
      type: object
      required: [name]
      properties:
        name: { type: string, maxLength: 80 }
        purpose: { type: string }
        rules: { type: string }
        status: { type: string, enum: [draft, published, deprecated] }

    CheckResult:
      type: object
      properties:
        name: { type: string }
        status: { type: string, enum: [pending, running, passed, failed] }
        output: { type: string }
        duration_ms: { type: integer }
        commit_sha: { type: string }

    DesignStandard:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        version: { type: integer }
        status: { type: string, enum: [draft, published] }
        spec: { type: object }
        sha256: { type: string }
        published_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }

