      - { $ref: "#/components/parameters/OrgParam" }
      - $ref: "#/components/parameters/RunParam"
    get:
      tags: [runs]
      operationId: streamRunEvents
      description: |
        Server-Sent Events. First a backfill from `run_events` (from `Last-Event-ID`), then live.
        Event catalog: `docs/api/events.md`.
      parameters:
        - name: Last-Event-ID
          in: header
          schema: { type: integer, format: int64, minimum: 0 }
      responses:
        "200":
          description: Stream
          content:
            text/event-stream:
              schema: { type: string }
